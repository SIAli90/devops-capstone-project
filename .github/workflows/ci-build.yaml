name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim

    services:
      postgres:
        image: postgres:alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: pgs3cr3t
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nosetests
        run: nosetests --with-spec --spec-color --with-coverage --cover-package=service tests/test_cli_commands.py tests/test_models.py tests/test_routes.py
        env:
          DATABASE_URI: postgresql://postgres:pgs3cr3t@postgres:5432/testdb

      - name: Verify application output on port 8080
        run: |
          python -m flask run --host=0.0.0.0 --port=8080 > /tmp/flask.log 2>&1 &
          sleep 5
          python - <<'PY'
          import urllib.request
          print(urllib.request.urlopen('http://127.0.0.1:8080/').read().decode().strip())
          PY
        env:
          FLASK_APP: service:app
          DATABASE_URI: postgresql://postgres:pgs3cr3t@postgres:5432/testdb
